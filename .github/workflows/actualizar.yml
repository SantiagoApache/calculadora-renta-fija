name: Actualizar datos y publicar

on:
  schedule:
    - cron: "37 11 * * *"   # 6:37 a. m. hora de Bogotá
    - cron: "37 23 * * *"   # 6:37 p. m. hora de Bogotá
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer datos nuevos
        if: github.event_name != 'push'
        env:
          NODE_EXTRA_CA_CERTS: scripts/certificados/banrep-cadena.pem
        run: node scripts/actualizar.js
      - name: Construir la página
        run: node scripts/build.js
      - name: Probar los motores (27 casos contra R)
        run: node test/probar.js
      - name: Guardar los datos nuevos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Datos actualizados $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push; fi
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
