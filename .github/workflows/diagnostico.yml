name: Diagnóstico de fuentes
on: workflow_dispatch
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diagnostico.js
        env:
          NODE_EXTRA_CA_CERTS: scripts/certificados/banrep-cadena.pem
